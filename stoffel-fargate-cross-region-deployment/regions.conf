# Single source of truth for region assignment: one AWS region per party,
# plus a dedicated region for the coordinator. Parsed by both app.py (CDK)
# and the regions shell script — edit only here, nothing else needs to
# change to add/remove/move a party's region.
#
# PARTY_REGIONS is space-separated and order-sensitive: index i is party i.

COORD_REGION="eu-west-1"
PARTY_REGIONS="eu-west-2 us-east-1 ap-northeast-1 ap-southeast-2 sa-east-1 eu-south-2 us-east-1 us-east-2 us-east-1 us-east-2"
