    environment:
      <<: *common-env
      STOFFEL_ROLE: party
      STOFFEL_PARTY_ID: "2"
      STOFFEL_BIND_ADDR: "172.28.0.12:9002"
      STOFFEL_ADVERTISE_IP: "172.28.0.12"
      STOFFEL_RPC_ADDR: "172.28.0.12:16182"
      STOFFEL_CERT: /app/ids/pub/nodes/node2.crt
      STOFFEL_KEY: /app/ids/priv/nodes/node2.der
      STOFFEL_PREPROC_STORE: /var/lib/stoffel-preproc
      STOFFEL_BOOTSTRAP_ADDR: "172.28.0.10:9000"
      STOFFEL_NODE_RPC_DESIGNATED_PARTY_CERT: /app/ids/pub/nodes/node0.crt
