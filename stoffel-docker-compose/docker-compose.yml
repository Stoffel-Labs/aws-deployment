networks:
  stoffel:
    driver: bridge

# Common build + mount config shared by all party containers.
x-party: &party
  build:
    context: ../StoffelVM
    dockerfile: Dockerfile.benchmark-flexible
  volumes:
    - ./programs:/app/programs:ro
    - ../ids:/app/ids:ro
  cap_add: [NET_ADMIN]
  # Wrapper: apply tc netem rules if NET_LOSS / NET_BANDWIDTH are set,
  # then run the party, and print peak memory on exit.
  entrypoint: ["/bin/bash", "-c"]
  command:
    - |
      NETEM=""
      if [ -n "${NET_LOSS}" ]; then NETEM="$$NETEM loss ${NET_LOSS}%"; fi
      if [ -n "${NET_BANDWIDTH}" ]; then NETEM="$$NETEM rate ${NET_BANDWIDTH}mbit"; fi
      if [ -n "$$NETEM" ]; then
        tc qdisc add dev eth0 root netem $$NETEM \
          || echo "WARNING: tc failed — iproute2 may not be installed in the image" >&2
      fi
      /app/entrypoint.sh; EXIT=$$?
      echo "Pinging coordinator..."
      ping -c 4 coordinator.stoffel-coord.local || true
      for i in $$(seq 0 4); do
        [ "$$i" = "$$STOFFEL_PARTY_ID" ] && continue
        echo "Pinging party$$i..."
        ping -c 4 party$$i.stoffel-coord.local || true
      done
      MEM=$$(cat /sys/fs/cgroup/memory.peak 2>/dev/null \
          || cat /sys/fs/cgroup/memory/memory.max_usage_in_bytes 2>/dev/null \
          || cat /sys/fs/cgroup/memory.current 2>/dev/null)
      [ -n "$$MEM" ] && echo "PEAK_MEM_BYTES: $$MEM"
      exit $$EXIT
  depends_on:
    coordinator:
      condition: service_healthy

# Environment variables shared by all parties.
x-common-env: &common-env
  STOFFEL_AUTH_TOKEN: "${STOFFEL_AUTH_TOKEN:-}"
  STOFFEL_N_PARTIES: "5"
  STOFFEL_THRESHOLD: "1"
  STOFFEL_ENTRY: main
  STOFFEL_COORD_ADDR: "coordinator.stoffel-coord.local:31415"
