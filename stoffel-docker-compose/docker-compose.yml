.crt,/app/ids/pub/clients/client59.crt,/app/ids/pub/clients/client60.crt,/app/ids/pub/clients/client61.crt,/app/ids/pub/clients/client62.crt,/app/ids/pub/clients/client63.crt,/app/ids/pub/clients/client64.crt,/app/ids/pub/clients/client65.crt,/app/ids/pub/clients/client66.crt,/app/ids/pub/clients/client67.crt,/app/ids/pub/clients/client68.crt,/app/ids/pub/clients/client69.crt,/app/ids/pub/clients/client70.crt,/app/ids/pub/clients/client71.crt,/app/ids/pub/clients/client72.crt,/app/ids/pub/clients/client73.crt,/app/ids/pub/clients/client74.crt,/app/ids/pub/clients/client75.crt,/app/ids/pub/clients/client76.crt,/app/ids/pub/clients/client77.crt,/app/ids/pub/clients/client78.crt,/app/ids/pub/clients/client79.crt,/app/ids/pub/clients/client80.crt,/app/ids/pub/clients/client81.crt,/app/ids/pub/clients/client82.crt,/app/ids/pub/clients/client83.crt,/app/ids/pub/clients/client84.crt,/app/ids/pub/clients/client85.crt,/app/ids/pub/clients/client86.crt,/app/ids/pub/clients/client87.crt,/app/ids/pub/clients/client88.crt,/app/ids/pub/clients/client89.crt,/app/ids/pub/clients/client90.crt,/app/ids/pub/clients/client91.crt,/app/ids/pub/clients/client92.crt,/app/ids/pub/clients/client93.crt,/app/ids/pub/clients/client94.crt,/app/ids/pub/clients/client95.crt,/app/ids/pub/clients/client96.crt,/app/ids/pub/clients/client97.crt,/app/ids/pub/clients/client98.crt,/app/ids/pub/clients/client99.crt"
      - --initial-mpc-nodes
      - "/app/ids/pub/nodes/node0.crt,/app/ids/pub/nodes/node1.crt,/app/ids/pub/nodes/node2.crt,/app/ids/pub/nodes/node3.crt,/app/ids/pub/nodes/node4.crt"
    ports:
      - "31415:31415"
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln 2>/dev/null | grep -q ':31415' || ss -tuln | grep -q ':31415'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      stoffel:
        ipv4_address: 172.28.0.5

  party0:
    <<: *party
    environment:
      <<: *common-env
      STOFFEL_ROLE: leader
      STOFFEL_PARTY_ID: "0"
      STOFFEL_BIND_ADDR: "172.28.0.10:9000"
      STOFFEL_ADVERTISE_IP: "172.28.0.10"
      STOFFEL_RPC_ADDR: "172.28.0.10:16180"
      STOFFEL_CERT: /app/ids/pub/nodes/node0.crt
      STOFFEL_KEY: /app/ids/priv/nodes/node0.der
      STOFFEL_PREPROC_STORE: /var/lib/stoffel-preproc
      STOFFEL_NODE_RPC_ADDRS: "172.28.0.10:16180,172.28.0.11:16181,172.28.0.12:16182,172.28.0.13:16183,172.28.0.14:16184"
      STOFFEL_NODE_RPC_DESIGNATED_PARTY_CERT: /app/ids/pub/nodes/node0.crt
    volumes:
      - ../programs:/app/programs:ro
      - ../ids/pub:/app/ids/pub:ro
      - ../ids/priv/nodes/node0.der:/app/ids/priv/nodes/node0.der:ro
      - party0-preproc:/var/lib/stoffel-preproc
    ports:
      - "9000:9000"
      - "16180:16180"
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln 2>/dev/null | grep -q ':9000' || ss -tuln | grep -q ':9000'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      stoffel:
        ipv4_address: 172.28.0.10

  party1:
    <<: *party
    environment:
      <<: *common-env
      STOFFEL_ROLE: party
      STOFFEL_PARTY_ID: "1"
      STOFFEL_BIND_ADDR: "172.28.0.11:9001"
      STOFFEL_ADVERTISE_IP: "172.28.0.11"
      STOFFEL_RPC_ADDR: "172.28.0.11:16181"
      STOFFEL_CERT: /app/ids/pub/nodes/node1.crt
      STOFFEL_KEY: /app/ids/priv/nodes/node1.der
      STOFFEL_PREPROC_STORE: /var/lib/stoffel-preproc
      STOFFEL_BOOTSTRAP_ADDR: "172.28.0.10:9000"
      STOFFEL_NODE_RPC_DESIGNATED_PARTY_CERT: /app/ids/pub/nodes/node0.crt
    volumes:
      - ../programs:/app/programs:ro
      - ../ids/pub:/app/ids/pub:ro
      - ../ids/priv/nodes/node1.der:/app/ids/priv/nodes/node1.der:ro
      - party1-preproc:/var/lib/stoffel-preproc
    ports:
      - "9001:9001"
      - "16181:16181"
    depends_on:
      coordinator:
        condition: service_healthy
      party0:
        condition: service_healthy
    networks:
      stoffel:
        ipv4_address: 172.28.0.11

  party2:
